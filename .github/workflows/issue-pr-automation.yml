name: Issue PR automation

on:
  issue_comment:
    types: [created]

concurrency:
  cancel-in-progress: true
  group: issue-pr-automation-${{ github.event.issue.number }}

jobs:
  handle-command:
    if: startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: 
      issues: write
      pull-requests: write
      contents: write


    steps: 
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Script
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/issue-pr-automation.js');
            await script({ github, context})